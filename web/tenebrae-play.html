<title>Wickbearer Pitch Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
  :root { --bg: #070506; --text: #f3ebe0; --muted: #9a9289; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 500 13px "IBM Plex Mono", ui-monospace, monospace; }
  #cv-demo { width: min(100vw, calc((100vh - 44px) * 1.6)); aspect-ratio: 960 / 600; height: auto; display: block; outline: none; }
  .keys { padding: 10px 16px; color: var(--muted); text-align: center; letter-spacing: .04em; line-height: 1.6; }
  .keys b { color: var(--text); font-weight: 600; }
</style>
<canvas id="cv-demo" tabindex="0" aria-label="Wickbearer playtest"></canvas>
<div class="keys"><b>M</b> sound on/off · <b>ESC</b> skip cutscene · <b>J</b> next shot · <b>A D</b> move · <b>SPACE</b> jump, double jump, wall jump · <b>J</b> attack (tap for combo) · <b>S + J</b> in air: slam · <b>SHIFT</b> dash · <b>S + SPACE</b> drop · controller works too</div>
<script>
(() => {
/* ---------- input: keyboard + gamepad ---------- */
const KEYS = { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  jump: ['Space', 'KeyZ', 'KeyK'], attack: ['KeyJ', 'KeyX'], dash: ['ShiftLeft', 'ShiftRight', 'KeyL', 'KeyC'] };
const held = new Set(), IN = {}, PR = {}, prevIN = {};
addEventListener('keydown', e => { if (Object.values(KEYS).flat().includes(e.code)) e.preventDefault(); held.add(e.code); });
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
function pollInput() {
  const pad = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(g => g);
  const b = i => !!(pad && pad.buttons[i] && pad.buttons[i].pressed), ax = i => pad ? pad.axes[i] || 0 : 0;
  const now = {
    left: b(14) || ax(0) < -.4, right: b(15) || ax(0) > .4, up: b(12) || ax(1) < -.5, down: b(13) || ax(1) > .5,
    jump: b(0), attack: b(2), dash: b(5) || b(7) || b(1) };
  for (const k in KEYS) { IN[k] = now[k] || KEYS[k].some(c => held.has(c)); PR[k] = IN[k] && !prevIN[k]; prevIN[k] = IN[k]; }
}

const TAU = Math.PI * 2, PI = Math.PI, S = Math.sin, Co = Math.cos;
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut = u => 1 - Math.pow(1 - u, 3);
const rnd = (a, b) => a + Math.random() * (b - a);
const C = { shade: '#0a0a0d', back: '#26232b', rim: 'rgba(255,128,88,.92)', crimson: '#e5383b', gold: '#f2b43a', cyan: '#3fd6c4', violet: '#b44dff',
  pink: '#f29aae', band: '#3a6fd0', wood: '#e9c690', steel: '#9aa3ad', hot: '#fff4d6' };
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"IBM Plex Mono", ui-monospace, monospace';
const DISP = '"Big Shoulders Display", Impact, sans-serif';

/* ---------- drawing primitives ---------- */
function cap(ctx, x1, y1, x2, y2, r1, r2) {
  const th = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.arc(x1, y1, r1, th + PI / 2, th + PI * 1.5);
  ctx.arc(x2, y2, r2, th - PI / 2, th + PI / 2);
  ctx.closePath(); ctx.fill();
}
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function shadow(ctx, x, y, rx, a = .38) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, .2);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(25,14,4,${a})`); g.addColorStop(1, 'rgba(25,14,4,0)');
  ctx.fillStyle = g; circ(ctx, 0, 0, rx); ctx.restore();
}

/* ---------- the rig ---------- */
// angles are measured from straight down; positive = towards facing direction
function rig(P) {
  const s = P.s || 1, f = P.f || 1, B = P.build || {}, k = B.k || 1;
  const L = { torso: 52 * s * (B.torso || 1), thigh: 34 * s * (B.leg || 1), shin: 34 * s * (B.leg || 1), ua: 25 * s * (B.arm || 1), fa: 24 * s * (B.arm || 1), head: (B.head || 15) * s };
  const lean = P.lean || 0, hx = P.x, hy = P.y;
  const nx = hx + S(lean) * f * L.torso, ny = hy - Co(lean) * L.torso;
  const sx = hx + S(lean) * f * L.torso * .84, sy = hy - Co(lean) * L.torso * .84;
  const ht = lean + (P.tilt || 0);
  const cx = nx + S(ht) * f * (L.head + 2 * s), cy = ny - Co(ht) * (L.head + 2 * s);
  const shapes = [];
  const limb = (ox, oy, a, b, l1, l2, r1, r2, r3, p, foot) => {
    const kx = ox + S(a) * f * l1, ky = oy + Co(a) * l1;
    const ex = kx + S(a + b) * f * l2, ey = ky + Co(a + b) * l2;
    shapes.push({ x1: ox, y1: oy, x2: kx, y2: ky, r1, r2, p }, { x1: kx, y1: ky, x2: ex, y2: ey, r1: r2, r2: r3, p });
    if (foot) shapes.push({ x1: ex, y1: ey, x2: ex + f * 8 * s * (B.foot || 1), y2: ey + 1.5 * s, r1: r3 * 1.05, r2: r3 * .8, p });
    else shapes.push({ c: 1, x1: ex, y1: ey, r1: r3 * 1.25, p });
    return { kx, ky, ex, ey, ang: a + b, can: Math.atan2(Co(a + b), S(a + b) * f) };
  };
  const J = { hip: [hx, hy], neck: [nx, ny], sh: [sx, sy], head: [cx, cy, L.head], f, s, lean, shapes };
  J.legB = limb(hx, hy, P.legs[0][0], P.legs[0][1], L.thigh, L.shin, 5.4 * s * k, 4.3 * s * k, 3.1 * s * k, 'B', 1);
  J.armB = limb(sx, sy, P.arms[0][0], P.arms[0][1], L.ua, L.fa, 4.4 * s * k, 3.3 * s * k, 2.6 * s * k, 'B', 0);
  shapes.push({ x1: hx, y1: hy, x2: sx, y2: sy, r1: 5.6 * s * k, r2: 7 * s * k * (B.chest || 1), p: 'T' });
  shapes.push({ x1: sx, y1: sy, x2: nx, y2: ny, r1: 5 * s * k, r2: 3.2 * s * k, p: 'T' });
  J.legF = limb(hx, hy, P.legs[1][0], P.legs[1][1], L.thigh, L.shin, 5.6 * s * k, 4.5 * s * k, 3.2 * s * k, 'F', 1);
  J.armF = limb(sx, sy, P.arms[1][0], P.arms[1][1], L.ua, L.fa, 4.6 * s * k, 3.4 * s * k, 2.7 * s * k, 'F', 0);
  return J;
}
function headShape(ctx, J, st) {
  const [x, y, r] = J.head, f = J.f;
  if (st.hood) {
    ctx.beginPath();
    ctx.moveTo(x - f * r * .5, y - r * 1.75);
    ctx.quadraticCurveTo(x + f * r * 1.3, y - r * .6, x + f * r * 1.05, y + r * 1.05);
    ctx.lineTo(x - f * r * 1.25, y + r * 1.2);
    ctx.quadraticCurveTo(x - f * r * 1.3, y - r * .4, x - f * r * .5, y - r * 1.75);
    ctx.fill();
  } else circ(ctx, x, y, r);
}
function paint(ctx, J, st = {}) {
  const s = J.s;
  const pass = (dx, dy, colB, colF, rimPass) => {
    ctx.save(); ctx.translate(dx, dy);
    for (const o of ['B', 'T', 'H', 'F']) {
      ctx.fillStyle = o === 'B' ? colB : colF;
      if (o === 'H') { headShape(ctx, J, st); if (st.headExtra && !rimPass) st.headExtra(ctx, J, colF); continue; }
      for (const sh of J.shapes) if (sh.p === o) sh.c ? circ(ctx, sh.x1, sh.y1, sh.r1) : cap(ctx, sh.x1, sh.y1, sh.x2, sh.y2, sh.r1, sh.r2);
    }
    ctx.restore();
  };
  if (st.rim !== false) pass(-1.5 * s, -1.4 * s, st.rim || C.rim, st.rim || C.rim, true);
  pass(0, 0, st.back || C.back, st.body || C.shade, false);
  if (st.eyes) eyes(ctx, J, st);
}
function eyes(ctx, J, st) {
  const [x, y, r] = J.head, f = J.f, s = J.s;
  ctx.save(); ctx.fillStyle = st.eyes; ctx.shadowColor = st.eyes; ctx.shadowBlur = (st.glow ?? 12) * s;
  const ey = y + (st.eyeY ?? .05) * r, ex = x + f * r * .42;
  const ry = r * (st.slit ? .07 : .13);
  [[-.34, 0], [.06, 0]].concat(st.third ? [[-.14, -.42]] : []).forEach(([dx, dy]) => {
    ctx.beginPath(); ctx.ellipse(ex + f * dx * r, ey + dy * r, r * .14, ry, st.slit ? f * .3 : 0, 0, TAU); ctx.fill();
  });
  ctx.restore();
}

/* ---------- props & effects ---------- */
function scarf(ctx, x, y, t, f, len, s, wind = 1, lift = 0) {
  ctx.save(); ctx.fillStyle = C.crimson; ctx.shadowColor = 'rgba(229,56,59,.55)'; ctx.shadowBlur = 8 * s;
  [[1, 0], [.72, 1.9]].forEach(([lm, ph]) => {
    const n = 16, top = [], bot = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, L = len * lm;
      const px = x - f * u * L * wind;
      const py = y + u * L * (.22 - lift) * (1.15 - wind * .5) + S(t * 9 - u * 5 + ph) * u * L * .11 + ph * u * 3 * s;
      const w = (1 - u * .72) * 5.4 * s;
      top.push([px, py - w / 2]); bot.push([px, py + w / 2]);
    }
    ctx.beginPath(); ctx.moveTo(top[0][0], top[0][1]);
    top.forEach(p => ctx.lineTo(p[0], p[1]));
    const e = top[n], eb = bot[n];
    ctx.lineTo(e[0] - f * 4 * s, (e[1] + eb[1]) / 2); // forked tail
    for (let i = n; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
    ctx.closePath(); ctx.fill();
  });
  ctx.shadowBlur = 0; circ(ctx, x, y, 4.6 * s);
  ctx.restore();
}
function smear(ctx, cx, cy, r, a0, a1, s, alpha = 1, col = C.gold) {
  if (alpha <= 0) return;
  const n = 18, ccw = a1 < a0;
  ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 20 * s; ctx.strokeStyle = col;
  for (let i = 0; i < n; i++) {
    const u0 = i / n, u1 = (i + 1) / n;
    ctx.globalAlpha = alpha * u1 * u1; ctx.lineWidth = (2 + u1 * 15) * s;
    ctx.beginPath(); ctx.arc(cx, cy, r, lerp(a0, a1, u0), lerp(a0, a1, u1), ccw); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = alpha * .9; ctx.strokeStyle = C.hot; ctx.lineWidth = 3.2 * s;
  ctx.beginPath(); ctx.arc(cx, cy, r, lerp(a0, a1, .5), a1, ccw); ctx.stroke();
  ctx.restore();
}
function emit(P, o) { o.max = o.life; P.push(Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, r: 2, col: '#000', glow: 0, kind: 'dot', a: 1 }, o)); }
function stepParts(ctx, P, dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.life -= dt;
    if (p.life <= 0) { P.splice(i, 1); continue; }
    const dr = Math.max(0, 1 - p.drag * dt);
    p.vx *= dr; p.vy = p.vy * dr + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.floor && p.y > p.floor) { p.y = p.floor; p.vy *= -.25; p.vx *= .6; }
    const a = p.life / p.max;
    ctx.globalAlpha = Math.min(1, a * 1.6) * p.a;
    ctx.shadowColor = p.col; ctx.shadowBlur = p.glow;
    if (p.kind === 'streak') {
      ctx.strokeStyle = p.col; ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke();
    } else if (p.kind === 'shred') {
      ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 9 + p.r);
      ctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); ctx.restore();
    } else {
      ctx.fillStyle = p.col; circ(ctx, p.x, p.y, p.r * (p.shrink ? a : 1));
    }
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function shadeBurst(P, x, y, s, n = 16, floor) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(60, 260) * s;
    emit(P, { x, y, vx: Co(a) * v, vy: S(a) * v - 60 * s, g: 520 * s, drag: 2, r: rnd(1.5, 4.5) * s, col: i % 4 ? '#14070b' : C.crimson, glow: i % 4 ? 0 : 8, life: rnd(.4, .9), floor });
  }
}
function sparks(P, x, y, s, n = 10, col = C.gold) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(180, 420) * s;
    emit(P, { x, y, vx: Co(a) * v, vy: S(a) * v, drag: 5, r: rnd(1.5, 2.6) * s, col, glow: 10, kind: 'streak', life: rnd(.18, .38) });
  }
}

/* ---------- grain texture ---------- */
const grain = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
  const d = g.createImageData(180, 180);
  for (let i = 0; i < d.data.length; i += 4) { const v = 90 + Math.random() * 165; d.data[i] = v; d.data[i + 1] = v * .96; d.data[i + 2] = v * .9; d.data[i + 3] = Math.random() * 70; }
  g.putImageData(d, 0, 0); return c;
})();
function vignette(W, H, a = .6, lx = W / 2, ly = H / 2) {
  const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const v = g.createRadialGradient(lx, ly, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(12,7,2,${a})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H); return c;
}

/* ---------- poses ---------- */
function runPose(ph, amp = 1) {
  return {
    legs: [0, 1].map(i => { const q = ph + i * PI; return [S(q) * .82 * amp, -(.28 + 1.4 * Math.max(0, Co(q))) * amp]; }),
    arms: [0, 1].map(i => { const q = ph + i * PI; return [-S(q) * .95 * amp, 1.45]; })
  };
}
function walkPose(ph, amp = .45) {
  return { legs: [0, 1].map(i => { const q = ph + i * PI; return [S(q) * amp, -(.12 + .7 * Math.max(0, Co(q)))]; }) };
}

/* ---------- character painters (shared by plates, demo and key art) ---------- */
function drawShambler(ctx, x, y, s, t, f = 1, st = {}) {
  const ph = t * 3.2 + (st.off || 0);
  const w = walkPose(ph, .42);
  const sway = S(t * 1.6 + (st.off || 0));
  const J = rig({ x, y: y - 63 * s + Math.abs(S(ph)) * -2.2 * s, f, s, lean: .55 + sway * .04, tilt: .35, build: { k: .92, chest: .9 },
    legs: w.legs, arms: [[1.32 + sway * .07, .22], [1.5 - sway * .07, .12]] });
  paint(ctx, J, Object.assign({ eyes: C.crimson }, st));
  return J;
}
function drawBrute(ctx, x, y, s, t, f = 1, st = {}) {
  const ph = t * 2.4 + (st.off || 0);
  const w = walkPose(ph, .36);
  const J = rig({ x, y: y - 60 * s + Math.abs(S(ph)) * -3 * s, f, s, lean: .22, tilt: .15,
    build: { k: 1.95, head: 18, chest: 1.45, torso: .92, arm: 1.12, leg: .88, foot: 1.3 },
    legs: w.legs, arms: [[-.25 + S(ph) * .25, .7], [.3 - S(ph) * .08, .3]] });
  // club resting over the shoulder, held in the front hand
  const hx = J.armF.ex, hy = J.armF.ey, ca = f > 0 ? .62 : PI - .62;
  const club = (col) => {
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(ca); ctx.fillStyle = col;
    cap(ctx, -10 * s, 0, 70 * s, 0, 5 * s, 14 * s);
    ctx.fillStyle = col === C.shade ? '#4b4a52' : col;
    for (let i = 0; i < 5; i++) { const px = (30 + i * 9) * s, sg = i % 2 ? 1 : -1, rr = (8 + i * 1.3) * s;
      ctx.beginPath(); ctx.moveTo(px - 3 * s, sg * rr); ctx.lineTo(px, sg * (rr + 8 * s)); ctx.lineTo(px + 3 * s, sg * rr); ctx.fill(); }
    ctx.restore();
  };
  const horns = (c2, J2, col) => {
    const [hx2, hy2, r] = J2.head; c2.fillStyle = col;
    [[-.55, -1], [.4, -1]].forEach(([dx]) => {
      c2.beginPath(); c2.moveTo(hx2 + dx * r * J2.f - 5 * s, hy2 - r * .7);
      c2.quadraticCurveTo(hx2 + dx * r * J2.f - 9 * s, hy2 - r * 1.9, hx2 + dx * r * J2.f + 2 * s * J2.f, hy2 - r * 2.05);
      c2.quadraticCurveTo(hx2 + dx * r * J2.f, hy2 - r * 1.3, hx2 + dx * r * J2.f + 6 * s, hy2 - r * .6); c2.fill();
    });
  };
  club('rgba(255,196,120,.8)'); // rim
  paint(ctx, J, Object.assign({ eyes: C.crimson, slit: 1, headExtra: horns }, st));
  club(C.shade);
  return J;
}
function drawBat(ctx, x, y, s, t, f = 1, st = {}) {
  const w = S(t * 15 + (st.off || 0)) * .8;
  const col = st.body || C.shade;
  ctx.save(); ctx.fillStyle = col;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(x + side * 9 * s, y - 3 * s); ctx.rotate(side * w); ctx.scale(side * s, s);
    ctx.beginPath();
    const pts = [[0, -6], [16, -22], [38, -34], [58, -26], [72, -10], [60, -8], [56, 4], [44, -3], [36, 9], [22, 0], [10, 8], [0, 6]];
    ctx.moveTo(pts[0][0], pts[0][1]); pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.fill();
    ctx.strokeStyle = 'rgba(255,196,120,.35)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(38, -30); ctx.moveTo(14, -4); ctx.lineTo(58, -24); ctx.moveTo(18, -2); ctx.lineTo(44, -3); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();
  for (let i = 0; i <= 26; i++) { const a = i / 26 * TAU, rr = (i % 2 ? 19 : 14.5) * s * (1 + S(i * 7.3) * .1); const px = x + Co(a) * rr, py = y + S(a) * rr * .92; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 10 * s, y - 12 * s); ctx.lineTo(x - 13 * s, y - 28 * s); ctx.lineTo(x - 3 * s, y - 15 * s);
  ctx.moveTo(x + 10 * s, y - 12 * s); ctx.lineTo(x + 13 * s, y - 28 * s); ctx.lineTo(x + 3 * s, y - 15 * s); ctx.fill();
  ctx.fillStyle = C.crimson; ctx.shadowColor = C.crimson; ctx.shadowBlur = 12 * s;
  ctx.beginPath(); ctx.ellipse(x - 6 * s, y - 2 * s, 4 * s, 3 * s, .3, 0, TAU); ctx.ellipse(x + 6 * s, y - 2 * s, 4 * s, 3 * s, -.3, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#f3ead6';
  ctx.beginPath(); ctx.moveTo(x - 5 * s, y + 7 * s); ctx.lineTo(x - 3 * s, y + 12 * s); ctx.lineTo(x - 1 * s, y + 7 * s);
  ctx.moveTo(x + 1 * s, y + 7 * s); ctx.lineTo(x + 3 * s, y + 12 * s); ctx.lineTo(x + 5 * s, y + 7 * s); ctx.fill();
  ctx.restore();
}
function drawPlayer(ctx, J, t, wind = 1, lift = 0) {
  scarf(ctx, J.neck[0] - J.f * 2 * J.s, J.neck[1] + 3 * J.s, t, J.f, 84 * J.s, J.s, wind, lift);
  paint(ctx, J);
}

/* draw a group at reduced opacity without overlapping limbs showing through */
/* ---------- dark stages ---------- */
function stageBg(W, H, o = {}) {
  const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const lx = o.lx ?? W * .5, ly = o.ly ?? H * .45, hue = (o.glow || [214, 86, 60]).join(',');
  const base = g.createLinearGradient(0, 0, 0, H); base.addColorStop(0, '#06060a'); base.addColorStop(1, '#100a0c');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * (o.spread || .62));

    ctx.fillStyle = 'rgba(0,0,0,.9)'; ctx.fillRect(x0 - 2, by + 2, bw + 4, 13); ctx.fillStyle = '#4a1014'; ctx.fillRect(x0, by + 4, bw, 9);

    ctx.save(); const g = ctx.createLinearGradient(x0, 0, x0 + bw, 0); g.addColorStop(0, '#7a1c1f'); g.addColorStop(1, C.crimson); ctx.fillStyle = g; ctx.shadowColor = C.crimson; ctx.shadowBlur = 8;
    ctx.globalAlpha = st.bossIntro > 0 ? .6 + S(st.time * 20) * .4 : 1; ctx.fillRect(x0, by, bw * k, 5); ctx.restore();
    txt(`${fmtT(st.rt)} · BOSS AT DEPTH ${roman(st.nextBoss)}`, W / 2, by + 22, `600 11px ${MONO}`, '#f3ebe0', 'center', 3);
  }
  const fv = clamp(st.flow / 20, 0, 1), mul = (1 + Math.floor(st.flow / 5) * .5).toFixed(1), fx = W - 210;
  txt('FLOW', fx, 24, `600 12px ${MONO}`, '#f3ebe0');
  txt('×' + mul, W - 16, 30, `900 26px ${DISP}`, fv > .5 ? C.gold : '#f3ebe0', 'right', 5);
  ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(fx - 2, 36, 196, 12); ctx.save(); ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = fv > .5 ? 12 : 0; ctx.fillRect(fx, 38, 192 * fv, 8); ctx.restore();
  const mmH = 180, mmW = mmH * DA.w / DA.h, mx = W - mmW - 14, my = 62;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(mx - 3, my - 3, mmW + 6, mmH + 6);
  drawArenaMap(ctx, DA, mx, my, mmW, mmH, { view: [st.cam.x - W / 2 / ZM, st.cam.y - H / 2 / ZM, W / ZM, H / ZM], dots: st.E.map(e => ({ x: e.x, y: e.y - 20, r: e.type === 'boss' ? 5 : e.elite ? 3 : 2.2, c: e.elite ? C.gold : e.type === 'sp' ? C.violet : C.crimson })).concat([{ x: p.x, y: p.y - 24, r: 3.4, c: C.gold }]) });
  // weapon, runes, sigils

  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(bx0, by0, 120, 46); ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.strokeRect(bx0 + .5, by0 + .5, 119, 45);
  blade(ctx, bx0 + 22, by0 + 26, -.2, st.weapon, 72 / (WLEN[st.weapon] + 30), .3);
  txt(st.weapon.toUpperCase() + (st.temper ? ' +' + st.temper : ''), bx0 + 60, by0 + 42, `600 10px ${MONO}`, C.gold, 'center', 3);
  st.runes.forEach((rn, i) => { const d = RUNE_DEFS[rn], x = bx0 + 144 + i * 28, y = by0 + 18, c = d.rar === 'cursed' ? C.crimson : SIGCOL[d.sig];
    diamond(ctx, x, y, 12, d.rar === 'cursed' ? '#3a0d12' : '#0d0b10', c, 6); txt(rn[0], x, y + 4, `600 10px ${MONO}`, '#f3ebe0', 'center', 3); });
  let sx = bx0 + 132;
  for (const s of ['GALE', 'EMBER', 'ECHO', 'EDGE']) { const n = sigCount(st, s); if (!n) continue; const lab = `${s} ${Math.min(n, 3)}/3`; txt(lab, sx, by0 + 44, `600 10px ${MONO}`, SIGCOL[s], 'left', 3); sx += ctx.measureText(lab).width + 12; }
  if (!st.runes.length) txt('NO RUNES YET · LEVEL UP TO DRAFT', bx0 + 132, by0 + 44, `600 10px ${MONO}`, '#9a9289', 'left', 3);
  [['DASH', 'SHIFT', Math.max(0, p.dashCd) / .6], ['SLAM', 'S+J', 0], ['WALL', 'SPACE', 0]].forEach(([n, k, cd], i) => {
    const x = W - 214 + i * 66, y = H - 66; ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(x, y, 58, 46); ctx.strokeStyle = 'rgba(255,128,88,.7)'; ctx.lineWidth = 1.5; ctx.strokeRect(x + .5, y + .5, 57, 45);
    if (cd > 0) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x + 1, y + 1, 56, 44 * Math.min(1, cd)); }
    txt(n, x + 29, y + 20, `600 11px ${MONO}`, '#f3ebe0', 'center', 3); txt(k, x + 29, y + 37, `600 11px ${MONO}`, '#9a9289', 'center', 3);
  });
  // XP bar
  const need = 8 + st.lvl * 5, xb = 64, xw = W - xb - 18;
  txt(`LV ${st.lvl}`, 18, H - 5, `600 10px ${MONO}`, C.cyan, 'left', 3);
  ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(xb - 1, H - 13, xw + 2, 7); ctx.save(); ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 8; ctx.fillRect(xb, H - 12, xw * clamp(st.xp / need, 0, 1), 5); ctx.restore();
  if (st.banner && !st.ov) { const b = st.banner, a = Math.min(1, b.t * 3, (1.2 - Math.min(1.2, b.t)) * 6 + .3), col = b.col || '#f3ebe0';
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    const gy = H * .38; const gb = ctx.createLinearGradient(0, 0, W, 0); gb.addColorStop(0, 'rgba(0,0,0,0)'); gb.addColorStop(.5, 'rgba(0,0,0,.7)'); gb.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gb; ctx.fillRect(0, gy - 44, W, 76);
    ctx.shadowColor = b.col || C.crimson; ctx.shadowBlur = 18;
    txt(b.text, W / 2, gy, `900 44px ${DISP}`, col, 'center', 6);
    ctx.shadowBlur = 0; txt(b.sub, W / 2, gy + 24, `600 13px ${MONO}`, b.col === C.crimson ? '#f3ebe0' : C.cyan, 'center', 3); ctx.restore(); }
  if (st.ov) (st.ov.kind === 'over' ? drawSummary : drawChoice)(ctx, st, W, H, txt);
  if (st.dying) STORY.drawDeath(ctx, st, W, H);
  AUDIO.hud(ctx, W, H);
}

function drawChoice(ctx, st, W, H, txt) {
  const o = st.ov, n = o.opts.length, t = o.t;
  const fade = clamp(t * 5, 0, 1) * clamp((o.dur - t) * 4, 0, 1), decided = t >= o.at, live_ = !decided;
  ctx.save(); ctx.globalAlpha = fade * .9; ctx.fillStyle = '#050304'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = fade;
  const head = o.kind === 'weapon' ? ['CHOOSE YOUR WEAPON', `RUN #${st.run} · SEED ${seedHex(st.seed)} · A NEW DRAW EVERY RUN`]
    : o.kind === 'draft' ? [`LEVEL ${o.lvl} · DRAFT A RUNE`, `DEPTH ${roman(st.depth)} · ${fmtT(st.rt)} · RUNES CHANGE HOW YOUR MOVES WORK`]
    : ['SHADE MERCHANT', `YOU HAVE ${st.runWax} RUN WAX · SPEND IT OR LOSE 60% OF IT ON DEATH`];
  ctx.shadowColor = C.crimson; ctx.shadowBlur = 20; txt(head[0], W / 2, 92, `900 40px ${DISP}`, '#f3ebe0', 'center', 6); ctx.shadowBlur = 0;
  txt(head[1], W / 2, 118, `600 12px ${MONO}`, '#9a9289', 'center', 3);
  const cw = n === 2 ? 230 : 214, ch = 290, gap = 26, x0 = (W - n * cw - (n - 1) * gap) / 2, y0 = 150;
  const hov = decided ? o.pick : Math.max(0, o.pick);
  for (let i = 0; i < n; i++) {
    const v = o.opts[i], sel = i === hov && o.pick >= 0, chosen = decided && i === o.pick, slide = easeOut(clamp(t * 4 - i * .3, 0, 1));
    const x = x0 + i * (cw + gap), y = y0 + (1 - slide) * 50 - (sel ? 12 : 0) - (chosen ? easeOut(clamp((t - o.at) * 4, 0, 1)) * 6 : 0), cx = x + cw / 2;
    let col = C.gold, label = '', name = '', desc = '';
    if (o.kind === 'weapon') { label = 'WEAPON'; name = v.toUpperCase(); desc = WDESC[v]; if (v === 'sickle') { label = 'NEW · UNLOCKED'; col = C.cyan; } }
    else if (o.kind === 'draft') { const d = RUNE_DEFS[v]; col = RARCOL[d.rar]; label = `${d.rar.toUpperCase()} · ${d.sig} SIGIL`; name = v; desc = d.d; }
    else { col = st.runWax >= v[2] ? C.gold : '#5a534d'; label = `◆ ${v[2]} WAX`; name = v[0]; desc = v[1]; }
    ctx.save(); ctx.globalAlpha = fade * slide * (decided && !chosen ? .3 : 1);
    rrect(ctx, x, y, cw, ch, 10);
    const g = ctx.createLinearGradient(0, y, 0, y + ch); g.addColorStop(0, '#17111a'); g.addColorStop(1, '#0a080c'); ctx.fillStyle = g;
    if (sel) { ctx.shadowColor = col; ctx.shadowBlur = chosen ? 34 : 20; } ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = col; ctx.lineWidth = sel ? 2.5 : 1.2; ctx.stroke();
    txt(label, cx, y + 26, `600 11px ${MONO}`, col, 'center', 3);
    // icon
    const iy = y + 92;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const rg = ctx.createRadialGradient(cx, iy, 0, cx, iy, 70); rg.addColorStop(0, o.kind === 'draft' && RUNE_DEFS[v].rar === 'cursed' ? 'rgba(229,56,59,.28)' : 'rgba(255,140,70,.18)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(cx - 70, iy - 70, 140, 140); ctx.restore();
    if (o.kind === 'weapon') blade(ctx, cx - 54, iy + 30, -.62, v, 120 / (WLEN[v] + 20), sel ? 1.2 : .5);
    else if (o.kind === 'draft') { const d = RUNE_DEFS[v], sc = d.rar === 'cursed' ? C.crimson : SIGCOL[d.sig]; diamond(ctx, cx, iy, 34, d.rar === 'cursed' ? '#3a0d12' : '#0d0b10', sc, sel ? 22 : 10); txt(d.sig[0], cx, iy + 11, `900 32px ${DISP}`, '#f3ebe0', 'center', 4); }
    else if (v[0] === 'MEND') { heart(ctx, cx - 16, iy + 2, 1.7, true); heart(ctx, cx + 16, iy + 2, 1.7, true); }
    else if (v[0] === 'TEMPER') blade(ctx, cx - 50, iy + 28, -.62, st.weapon, 110 / (WLEN[st.weapon] + 20), 1.4);
    else if (v[0] === 'PURGE') { diamond(ctx, cx, iy, 30, '#3a0d12', C.crimson, 12); ctx.strokeStyle = '#f3ebe0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - 16, iy - 16); ctx.lineTo(cx + 16, iy + 16); ctx.moveTo(cx + 16, iy - 16); ctx.lineTo(cx - 16, iy + 16); ctx.stroke(); }
    else for (let k = -1; k <= 1; k++) diamond(ctx, cx + k * 28, iy, 16, '#0d0b10', C.cyan, 8);
    txt(name, cx, y + 170, `900 ${name.length > 11 ? 24 : 28}px ${DISP}`, '#f3ebe0', 'center', 5);
    ctx.font = `500 14px ${BODY}`; ctx.fillStyle = '#c9bfb4'; ctx.textAlign = 'center'; wrapText(ctx, desc, cx, y + 196, cw - 34, 19);
    if (o.kind === 'draft') { const d = RUNE_DEFS[v], c = sigCount(st, d.sig) + 1;
      for (let k = 0; k < 3; k++) diamond(ctx, cx - 16 + k * 16, y + ch - 30, 5, k < c ? SIGCOL[d.sig] : 'rgba(255,255,255,.12)', null);
      txt(c >= 3 ? 'COMPLETES SET' : `${d.sig} ${Math.min(c, 3)}/3`, cx, y + ch - 12, `600 10px ${MONO}`, c >= 3 ? C.gold : '#9a9289', 'center', 3); }
    if (chosen) { ctx.save(); ctx.translate(cx, y + ch - 2); ctx.rotate(-.06); rrect(ctx, -58, -16, 116, 30, 4); ctx.fillStyle = '#0a080c'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      txt(o.kind === 'weapon' ? 'EQUIPPED' : o.kind === 'draft' ? 'DRAFTED' : 'BOUGHT', 0, 6, `900 18px ${DISP}`, col, 'center', 3); ctx.restore(); }
    ctx.restore();
  }
  if (!decided || o.pick >= 0) { const px = x0 + hov * (cw + gap) + cw / 2, py = y0 + ch + 30 + S(t * 10) * 2;
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.moveTo(px, py - 10); ctx.lineTo(px + 8, py + 2); ctx.lineTo(px - 8, py + 2); ctx.fill(); }
  if (decided && o.pick < 0) txt('NOT ENOUGH WAX · YOU WALK ON', W / 2, y0 + ch + 34, `600 12px ${MONO}`, '#9a9289', 'center', 3);
  txt(o.kind === 'shop' ? '← →  CHOOSE     J / SPACE  BUY     SHIFT  LEAVE' : '← →  CHOOSE     J / SPACE  CONFIRM', W / 2, y0 + ch + 66, `600 11px ${MONO}`, '#6f675f', 'center', 3);
  ctx.restore();
}

// the Tenebrae hearse: fifteen candles on a triangle, one goes out per depth; the small one below is the hidden candle
function hearse(ctx, x, y, depth, hidden, t) {
  const out = STORY.candlesOut(depth), w = 150, top = 46;
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = '#3a2f2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w / 2, y - top); ctx.lineTo(x + w, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + 12); ctx.stroke();
  for (let i = 0; i < 15; i++) {
    // candles go out alternately from the two ends toward the top, as in the service
    const order = i % 2 ? 14 - (i >> 1) : i >> 1, lit = i >= out;
    const cx = x + 5 + order * (w - 10) / 14, cy = y - top * (1 - Math.abs(order - 7) / 7) - 2;
    ctx.fillStyle = lit ? '#e8dccb' : '#5a524c'; ctx.fillRect(cx - 1.5, cy - 9, 3, 9);
    if (lit) { const fl = 1 + S(t * 13 + i * 1.7) * .15; ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.ellipse(cx, cy - 12, 2 * fl, 3.6 * fl, 0, 0, TAU); ctx.fill(); ctx.shadowBlur = 0; }
    else { ctx.strokeStyle = 'rgba(200,190,180,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.quadraticCurveTo(cx + S(t * 2 + i) * 4, cy - 16, cx + S(t * 2.6 + i) * 3, cy - 22); ctx.stroke(); }
  }
  ctx.font = `600 10px ${MONO}`; ctx.textAlign = 'left'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  const lab = `${15 - out} OF 15 LIT`; ctx.strokeText(lab, x + w / 2 + 12, y + 24); ctx.fillStyle = '#9a9289'; ctx.fillText(lab, x + w / 2 + 12, y + 24);
  const hx = x + w / 2, hy = y + 26;
  ctx.fillStyle = '#d9cfc0'; ctx.fillRect(hx - 1.5, hy - 7, 3, 7);
  if (hidden) { ctx.fillStyle = C.crimson; ctx.shadowColor = C.crimson; ctx.shadowBlur = 10; ctx.beginPath(); ctx.ellipse(hx, hy - 10, 2, 3.4, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawSummary(ctx, st, W, H, txt) {
  const o = st.ov, t = o.t, fade = clamp(t * 3, 0, 1) * clamp((o.dur - t) * 3, 0, 1);
  ctx.save(); ctx.globalAlpha = fade * .88; ctx.fillStyle = '#050304'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = fade;
  ctx.shadowColor = C.crimson; ctx.shadowBlur = 28; txt(o.victory ? 'THE DAWN RETURNS' : 'LIGHTS OUT', W / 2, 100, `900 64px ${DISP}`, o.victory ? C.gold : C.crimson, 'center', 6); ctx.shadowBlur = 0;
  txt(`RUN #${o.run} · HANGING SPIRE · SEED ${seedHex(o.seed)} · PERMADEATH`, W / 2, 126, `600 12px ${MONO}`, '#9a9289', 'center', 3);
  const cols = [['DEPTH', String(o.depth), o.newBest ? 'NEW BEST' : `BEST ${o.best}`], ['TIME', fmtT(o.time), 'ENDLESS'], ['BOSSES', String(o.bosses), 'SLAIN'], ['KILLS', String(o.kills), 'THIS RUN']];
  cols.forEach(([a, b, c], i) => { const x = W / 2 + (i - 1.5) * 150, k = clamp(t * 3 - .5 - i * .25, 0, 1); ctx.globalAlpha = fade * k;
    txt(a, x, 170, `600 11px ${MONO}`, '#9a9289', 'center', 3); txt(b, x, 212, `900 44px ${DISP}`, '#f3ebe0', 'center', 5); txt(c, x, 232, `600 10px ${MONO}`, c === 'NEW BEST' ? C.gold : '#6f675f', 'center', 3); });
  ctx.globalAlpha = fade;
  // build chips
  ctx.font = `600 11px ${MONO}`; const chips = o.build.map((n, i) => { const d = RUNE_DEFS[n]; return [n.toUpperCase(), i === 0 ? C.gold : d.rar === 'cursed' ? C.crimson : SIGCOL[d.sig]]; });
  const ws = chips.map(c => ctx.measureText(c[0]).width + 20), tw = ws.reduce((a, b) => a + b, 0) + (chips.length - 1) * 8; let cx = (W - tw) / 2;
  txt('BUILD', W / 2, 262, `600 10px ${MONO}`, '#6f675f', 'center', 3);
  chips.forEach(([s, c], i) => { rrect(ctx, cx, 272, ws[i], 24, 12); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 1.2; ctx.stroke(); txt(s, cx + ws[i] / 2, 288, `600 11px ${MONO}`, c, 'center', 3); cx += ws[i] + 8; });
  // wax
  const ki = clamp((t - 1.2) / .8, 0, 1);
  txt(`WAX COLLECTED  ${o.wax}`, W / 2 - 20, 336, `600 13px ${MONO}`, '#f3ebe0', 'right', 3);
  txt(`40% KEPT${o.bosses ? ' + BOSS BONUS' : ''}  +${Math.round(o.kept * ki)}`, W / 2 + 20, 336, `600 13px ${MONO}`, C.cyan, 'left', 3);
  // unlock progress
  const bw = 440, bx = (W - bw) / 2, by = 372, fk = lerp(o.from, Math.min(1, o.to), easeOut(clamp((t - 1.8) / 1.2, 0, 1)));
  txt(`NEXT UNLOCK · ${o.U[0]}`, bx, by - 8, `600 12px ${MONO}`, '#f3ebe0', 'left', 3); txt(o.U[1], bx + bw, by - 8, `600 11px ${MONO}`, '#9a9289', 'right', 3);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(bx, by, bw, 12);
  ctx.save(); ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = 12; ctx.fillRect(bx, by, bw * fk, 12); ctx.restore();
  if (o.unlocked && t > 3.1) { const k = easeOut(clamp((t - 3.1) * 4, 0, 1)); ctx.save(); ctx.translate(W / 2, by + 52); ctx.scale(1.6 - k * .6, 1.6 - k * .6); ctx.globalAlpha = fade * k;
    ctx.shadowColor = C.gold; ctx.shadowBlur = 26; txt(`UNLOCKED · ${o.unlocked[0]}`, 0, 0, `900 34px ${DISP}`, C.gold, 'center', 5); ctx.restore();
    txt(`IT CAN NOW APPEAR IN YOUR DRAWS · NEXT: ${o.next[0]}`, W / 2, by + 80, `600 11px ${MONO}`, '#9a9289', 'center', 3); }
  else if (!o.unlocked) txt(`${Math.round(Math.min(1, o.to) * 100)}% · KEEP CLIMBING`, W / 2, by + 34, `600 11px ${MONO}`, '#9a9289', 'center', 3);
  if (o.arena && t > 3.6) txt('ARENA UNLOCKED THIS RUN · THE DROWNED WELL', W / 2, by + 108, `600 12px ${MONO}`, C.cyan, 'center', 3);
  txt(t > 2.5 ? 'PRESS J OR SPACE TO RELIGHT THE CANDLES · NEW SEED · NEW DRAWS' : 'LIGHTS OUT', W / 2, H - 26, `600 12px ${MONO}`, '#6f675f', 'center', 3);
  ctx.restore();
}

/* ---------- loop ---------- */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { const r = R.find(x => x.cv === en.target); if (r) r.vis = en.isIntersecting; }), { rootMargin: '100px' }) : null;

R.filter(r => r.cv.id === 'cv-demo').forEach(r => { r.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); for (let i = 0; i < 30; i++) r.fn(r.ctx, 0, 1 / 30, r); });
const draw = (r, dt) => { r.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); r.fn(r.ctx, r.t, dt, r); };
if (reduce) {
  R.forEach(r => { r.t = .55; draw(r, 0); });
} else {
  let last = performance.now();
  const frame = now => {
    const dt = clamp((now - last) / 1000, 0, .05); last = now;
    for (const r of R) if (r.vis) { r.t += dt; draw(r, dt); }
    requestAnimationFrame(frame);
  };
  R.forEach(r => draw(r, 0));
  requestAnimationFrame(frame);
}
})();
</script>
