name: check
on:
  push:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log
      - name: Run the main scene for 600 frames
        run: timeout 120 godot --headless --quit-after 600 2>&1 | tee run.log
      - name: Smoke test (bot plays through depths, boss, revive, death and every map)
        run: timeout 180 godot --headless -- --smoke 2>&1 | tee smoke.log
      - name: Fail on script errors
        run: |
          # each error and the line after it (the res:// location) become annotations,
          # so they can be read through the API without the raw log
          if grep -nE -A1 "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Invalid assignment" import.log run.log smoke.log > errors.txt; then
            sed -E 's/^[a-z]+\.log[:-][0-9]+[:-]//' errors.txt | awk '!seen[$0]++' > unique.txt
            head -c 60000 unique.txt | paste -sd'|' | fold -w 3500 | while read -r chunk; do echo "::error::$chunk"; done
            echo "Godot reported script errors"; exit 1
          fi
          grep -q "smoke test: done" smoke.log || { echo "::error::smoke test did not finish: $(tail -c 2000 smoke.log | paste -sd'|')"; exit 1; }
          echo "No script errors"

  # Every green push to main becomes a downloadable playtest build on the Releases page.
  release:
    needs: godot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Export Windows and Linux
        run: |
          mkdir -p build/windows build/linux
          godot --headless --import >/dev/null 2>&1 || true
          godot --headless --export-release "Windows" build/windows/Tenebrae.exe
          godot --headless --export-release "Linux" build/linux/Tenebrae.x86_64
          cd build && zip -qr ../Tenebrae-windows.zip windows && zip -qr ../Tenebrae-linux.zip linux
          ls -la ..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: playtest-${{ github.run_number }}
          name: Playtest ${{ github.run_number }}
          body: "Automatic playtest build of ${{ github.sha }}. Download the zip for your system, unzip, and run Tenebrae."
          files: |
            Tenebrae-windows.zip
            Tenebrae-linux.zip
