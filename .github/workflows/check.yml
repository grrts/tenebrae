name: check
on:
  push:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Locals declared twice (Godot rejects these, gdparse does not)
        run: if command -v python3 >/dev/null; then python3 tools/check_locals.py src/*.gd; else echo "python3 missing, skipped"; fi
      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log
      - name: Run the main scene for 600 frames
        run: timeout 120 godot --headless --quit-after 600 2>&1 | tee run.log
      - name: Smoke test (bot plays the whole story to the dawn, then the revive, a death and every map)
        run: timeout 180 godot --headless -- --smoke 2>&1 | tee smoke.log
      - name: Fail on script errors
        run: |
          # each error and the line after it (the res:// location) become annotations,
          # so they can be read through the API without the raw log
          if grep -nE -A1 "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Invalid assignment" import.log run.log smoke.log > errors.txt; then
            sed -E 's/^[a-z]+\.log[:-][0-9]+[:-]//' errors.txt | awk '!seen[$0]++' > unique.txt
            head -c 60000 unique.txt | paste -sd'|' | fold -w 3500 | while read -r chunk; do echo "::error::$chunk"; done
            echo "Godot reported script errors"; exit 1
          fi
          echo "::notice::$(grep 'smoke test:' smoke.log | paste -sd'|')"
          grep -q "smoke test: done" smoke.log || { echo "::error::smoke test did not finish: $(tail -c 2000 smoke.log | paste -sd'|')"; exit 1; }
          echo "No script errors"

  # Every green push to main becomes a downloadable playtest build on the Releases page.
  release:
    needs: godot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          # the image ships templates under /root; GitHub sets HOME to /github/home
          src=$(dirname "$(find / -name 'linux_release.x86_64' -path '*export_templates*' 2>/dev/null | head -1)")
          echo "templates found in: $src"
          mkdir -p ~/.local/share/godot/export_templates/
          ln -sfn "$src" ~/.local/share/godot/export_templates/$(basename "$src")
      - name: Export Windows and Linux
        run: |
          mkdir -p build/windows build/linux
          echo "templates: $(ls ~/.local/share/godot/export_templates/ 2>&1) home=$HOME"
          godot --headless --import >/dev/null 2>&1 || true
          ok=1
          for p in Windows:build/windows/Wickbearer.exe Linux:build/linux/Wickbearer.x86_64; do
            godot --headless --export-release "${p%%:*}" "${p#*:}" > export.log 2>&1 || ok=0
            [ -f "${p#*:}" ] || ok=0
            grep -E "ERROR|error|rror:" export.log | awk '!seen[$0]++' | head -20 | paste -sd'|' | sed 's/^/::warning::'"${p%%:*}"' export: /'
          done
          [ "$ok" = 1 ] || { echo "::error::export failed, templates: $(ls -R ~/.local/share/godot/export_templates/ | head -20 | paste -sd' ')"; exit 1; }
          cd build && zip -qr ../Wickbearer-windows.zip windows && zip -qr ../Wickbearer-linux.zip linux
          ls -la ..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: playtest-${{ github.run_number }}
          name: Playtest ${{ github.run_number }}
          body: "Automatic playtest build of ${{ github.sha }}. Download the zip for your system, unzip, and run Wickbearer."
          files: |
            Wickbearer-windows.zip
            Wickbearer-linux.zip
